spring:
  datasource:
    url: jdbc:mysql://${RDB_HOST}:${RDB_PORT}/${RDB_NAME}?rewriteBatchedStatements=true
    username: ${RDB_USERNAME}
    password: ${RDB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    name: main # add tag to HikariCP metrics

    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: ${HIKARI_CONN_TIMEOUT_MS:30000}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # batching
        jdbc:
          batch_size: 50
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3s

  # store session in redis
  session:
    store-type: redis
    timeout: 30m
    data:
      redis:
        namespace: ecommerce:session

app:
  storage:
    gcs:
      project-id: ${GCP_PROJECT_ID}
      bucket: ${GCS_BUCKET}
      upload-prefix: ${GCS_UPLOAD_PREFIX}
      public-base-url: https://storage.googleapis.com/${GCS_BUCKET}