server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: api

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# custom
app:
  storage:
    provider: gcs