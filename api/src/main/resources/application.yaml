server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: api

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# custom
app:
  storage:
    provider: gcs