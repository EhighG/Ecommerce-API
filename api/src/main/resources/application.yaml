server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: api

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# custom
app:
  storage:
    provider: gcs

  product-view-count:
    flush:
      batch-size: ${PRODUCT_VIEW_COUNT_FLUSH_BATCH_SIZE}
      max-batches-per-run: ${PRODUCT_VIEW_COUNT_FLUSH_MAX_BATCHES_PER_RUN}
