server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: api

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# API 명세(springdoc). 실행 중인 서버에서는 local 프로필에서만 켠다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: true
    tags-sorter: alpha
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

# custom
app:
  storage:
    provider: gcs

  product-view-count:
    flush:
      batch-size: ${PRODUCT_VIEW_COUNT_FLUSH_BATCH_SIZE:100}
      max-batches-per-run: ${PRODUCT_VIEW_COUNT_FLUSH_MAX_BATCHES_PER_RUN:10}
