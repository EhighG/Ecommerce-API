name: Backend Deploy

on:
  # push:
  #   branches: ["release"]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      INSTANCE_NAME: ${{vars.GCE_INSTANCE_NAME }}
      ZONE: ${{ vars.GCE_ZONE }}
      REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      IMAGE_NAME: ${{ vars.API_SERVER_IMAGE_NAME }}
      IMAGE_URI: asia-northeast3-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.API_SERVER_IMAGE_NAME }}
      MIG_WAIT_TIMEOUT_SECONDS: 1200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle
        working-directory: api
        run: chmod +x ./gradlew

      - name: Run backend tests
        working-directory: api
        run: ./gradlew cleanTest test --stacktrace

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Build backend image
        working-directory: api
        run: docker build -t "$IMAGE_URI:${{ github.sha }}" -t "$IMAGE_URI:latest" .

      - name: Push backend image
        run: |
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

      - name: Recreate MIG instances
        run: |
          gcloud compute instance-groups managed rolling-action replace "${{ vars.MIG_NAME }}" \
            --zone "$ZONE" \
            --max-unavailable=100% \
            --max-surge=0

          gcloud compute instance-groups managed wait-until "instance-group-2" \
            --zone "$ZONE" \
            --stable \
            --timeout="$MIG_WAIT_TIMEOUT_SECONDS"
