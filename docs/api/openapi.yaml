openapi: 3.1.0
info:
  description: |
    오픈마켓형 이커머스 REST API. 이 명세는 컨트롤러와 DTO에서 생성된다.

    - 세션·CSRF 절차, 주문 생성의 멱등 키, 오류 응답 형식과 공통 오류 매핑: [contracts.md](https://github.com/EhighG/Ecommerce-API/blob/develop/docs/contracts.md)
    - 역할별 권한과 소유자 검사: [security.md](https://github.com/EhighG/Ecommerce-API/blob/develop/docs/security.md)의 "인가 규칙"
    - 엔드포인트마다 적은 오류는 클라이언트가 분기할 업무 오류다. 오류 응답의 `message`는 예시이고, 같은 `code`라도 더 구체적인 문장이 올 수 있다. 분기는 HTTP 상태와 `code`로만 한다.

    **Try it out(로컬 서버)**
    1. `GET /auth/csrf`를 실행하고 응답의 `token`을 복사한다.
    2. Authorize에서 `csrf`(`X-CSRF-TOKEN` 헤더)에 그 값을 넣는다.
    3. `POST /auth/login`으로 로그인한다. 세션 쿠키는 브라우저가 보낸다.

    로그아웃하거나 세션이 만료되면 1부터 다시 한다.
  title: Ecommerce API
  version: v1
servers:
- description: 로컬 서버
  url: http://localhost:8081/api
tags:
- description: "세션, CSRF 토큰, 로그인·로그아웃"
  name: Auth
- description: 장바구니
  name: Cart
- description: 쿠폰 이벤트와 발급
  name: Coupon
- description: 이미지 업로드
  name: Media
- description: 주문
  name: Order
- description: 주문항목 조회와 상태 변경
  name: OrderItem
- description: "상품, 카테고리, 재고"
  name: Product
- description: 리뷰
  name: Review
- description: "가입, 프로필, 회원 정보, 탈퇴"
  name: User
paths:
  /auth/csrf:
    get:
      description: "세션이 없으면 만들고, 상태 변경 요청에 넣을 CSRF 헤더 이름과 토큰을 준다."
      operationId: auth_getCsrfToken
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCsrfTokenRes"
          description: OK
      summary: 세션 생성과 CSRF 토큰 발급
      tags:
      - Auth
  /auth/login:
    post:
      description: 현재 세션을 인증한다.
      operationId: auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginReq"
        required: true
      responses:
        "200":
          description: 로그인 성공. 본문 없음
        "401":
          description: "로그인 실패. 본문 없음. 없는 이메일, 틀린 비밀번호, 탈퇴한 사용자를 구분하지 않는다"
      security:
      - csrf: []
      summary: 로그인
      tags:
      - Auth
  /auth/logout:
    post:
      description: 세션을 무효화한다.
      operationId: auth_logout
      responses:
        "200":
          description: 본문 없음
      security:
      - csrf: []
      summary: 로그아웃
      tags:
      - Auth
  /cart-items:
    get:
      operationId: cartItem_findCartItems
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItemListRes"
          description: OK
      summary: 내 장바구니
      tags:
      - Cart
    post:
      description: 이미 담긴 상품이면 수량을 더한다. 응답은 장바구니 항목 ID다.
      operationId: cartItem_addItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddItemReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: integer
                format: int64
          description: OK
        "404":
          content:
            application/json:
              examples:
                "2000":
                  summary: 2000 없거나 삭제된 상품
                  value:
                    code: "2000"
                    message: 상품을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `2000`: 없거나 삭제된 상품"
        "409":
          content:
            application/json:
              examples:
                "7001":
                  summary: 7001 같은 상품을 동시에 담아 충돌함. 다시 시도한다
                  value:
                    code: "7001"
                    message: 장바구니 항목이 이미 변경되었습니다. 잠시 후 다시 시도해주세요.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `7001`: 같은 상품을 동시에 담아 충돌함. 다시 시도한다"
      security:
      - csrf: []
      summary: 장바구니에 담기
      tags:
      - Cart
  /cart-items/quantity:
    patch:
      description: 장바구니 항목 ID가 아니라 상품 ID로 항목을 찾는다.
      operationId: cartItem_changeQuantity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeQuantityReq"
        required: true
      responses:
        "200":
          description: OK
        "404":
          content:
            application/json:
              examples:
                "7000":
                  summary: 7000 그 상품이 장바구니에 없음
                  value:
                    code: "7000"
                    message: 장바구니 항목을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `7000`: 그 상품이 장바구니에 없음"
      security:
      - csrf: []
      summary: 장바구니 수량 변경
      tags:
      - Cart
  /cart-items/{cartItemId}:
    delete:
      operationId: cartItem_removeItem
      parameters:
      - in: path
        name: cartItemId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "404":
          content:
            application/json:
              examples:
                "7000":
                  summary: 7000 없거나 남의 항목
                  value:
                    code: "7000"
                    message: 장바구니 항목을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `7000`: 없거나 남의 항목"
      security:
      - csrf: []
      summary: 장바구니 항목 삭제
      tags:
      - Cart
  /coupons/events:
    post:
      description: 응답은 이벤트 ID다.
      operationId: coupon_createCouponEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponEventReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: integer
                format: int64
          description: OK
      security:
      - csrf: []
      summary: 쿠폰 이벤트 생성
      tags:
      - Coupon
  /coupons/events/{couponEventId}:
    get:
      operationId: coupon_getCouponEventDetail
      parameters:
      - in: path
        name: couponEventId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponEventDetailRes"
          description: OK
        "404":
          content:
            application/json:
              examples:
                "7500":
                  summary: 7500 이벤트가 없음
                  value:
                    code: "7500"
                    message: 쿠폰 이벤트를 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `7500`: 이벤트가 없음"
      summary: 쿠폰 이벤트 조회
      tags:
      - Coupon
  /coupons/events/{couponEventId}/issue:
    post:
      description: 응답의 `couponIssuedId`를 주문할 때 쓴다.
      operationId: coupon_issueCoupon
      parameters:
      - in: path
        name: couponEventId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueCouponRes"
          description: OK
        "400":
          content:
            application/json:
              examples:
                "7503":
                  summary: 7503 발급 기간이 아님
                  value:
                    code: "7503"
                    message: 진행 중인 쿠폰 이벤트가 아닙니다.
                "7506":
                  summary: 7506 이미 이 이벤트의 쿠폰을 받음
                  value:
                    code: "7506"
                    message: 이미 발급받은 쿠폰입니다.
                "7507":
                  summary: 7507 수량이 모두 소진됨
                  value:
                    code: "7507"
                    message: 쿠폰이 모두 소진되었습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `7503`: 발급 기간이 아님
            - `7506`: 이미 이 이벤트의 쿠폰을 받음
            - `7507`: 수량이 모두 소진됨
      security:
      - csrf: []
      summary: 쿠폰 발급(선착순)
      tags:
      - Coupon
  /media/upload-complete:
    post:
      description: GCS에 올린 객체를 내 이미지로 등록한다. 응답의 `imageId`를 상품 등록과 이미지 교체에 쓴다.
      operationId: media_completeUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadRes"
          description: OK
        "400":
          content:
            application/json:
              examples:
                "8001":
                  summary: 8001 올린 객체가 이미지가 아님
                  value:
                    code: "8001"
                    message: 이미지 파일만 업로드할 수 있습니다.
                "8002":
                  summary: 8002 다른 사람이 이미 등록한 경로
                  value:
                    code: "8002"
                    message: 해당 이미지에 대한 권한이 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `8001`: 올린 객체가 이미지가 아님
            - `8002`: 다른 사람이 이미 등록한 경로
        "404":
          content:
            application/json:
              examples:
                "8000":
                  summary: 8000 GCS에 객체가 없음
                  value:
                    code: "8000"
                    message: 업로드된 파일을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `8000`: GCS에 객체가 없음"
      security:
      - csrf: []
      summary: 업로드 완료 등록
      tags:
      - Media
  /media/upload-url:
    post:
      description: "응답의 `uploadUrl`로 GCS에 직접 `PUT`한 뒤 `POST /media/upload-complete`로\
        \ 등록한다. 업로드 조건은 [business-rules.md](https://github.com/EhighG/Ecommerce-API/blob/develop/docs/business-rules.md)의\
        \ 이미지 업로드 절에 있다. 조건이 맞지 않거나 URL이 만료되면 GCS가 403을 준다."
      operationId: media_createImageUploadUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadUrlReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadUrlRes"
          description: OK
        "400":
          content:
            application/json:
              examples:
                "8001":
                  summary: 8001 `contentType`이 이미지가 아님
                  value:
                    code: "8001"
                    message: 이미지 파일만 업로드할 수 있습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `8001`: `contentType`이 이미지가 아님"
      security:
      - csrf: []
      summary: 업로드 URL 발급
      tags:
      - Media
  /media/uploaded-images:
    get:
      operationId: media_getUploadedImageInfoList
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedImageListRes"
          description: OK
      summary: 업로드 이미지 목록
      tags:
      - Media
  /order-items:
    get:
      description: '`orderId`와 `sellerId` 중 하나만 준다. 둘의 응답 형태가 다르다.'
      operationId: orderItem_findOrderItems
      parameters:
      - description: 이 주문의 항목을 조회한다(구매자). `sellerId`와 함께 줄 수 없다
        in: query
        name: orderId
        required: false
        schema:
          type: integer
          format: int64
          description: 이 주문의 항목을 조회한다(구매자). `sellerId`와 함께 줄 수 없다
      - description: 본인 ID. 자기 상품의 주문항목을 조회한다(판매자)
        in: query
        name: sellerId
        required: false
        schema:
          type: integer
          format: int64
          description: 본인 ID. 자기 상품의 주문항목을 조회한다(판매자)
      - description: '`sellerId`로 조회할 때만 쓴다'
        in: query
        name: statusList
        required: false
        schema:
          type: array
          description: '`sellerId`로 조회할 때만 쓴다'
          items:
            type: string
            description: '`sellerId`로 조회할 때만 쓴다'
            enum:
            - ORDERED
            - SHIPPED
            - DELIVERED
            - PURCHASE_CONFIRMED
            - CANCELED
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          enum:
          - 20
          - 50
          - 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/BuyerOrderItemSearchRes"
                - $ref: "#/components/schemas/SellerOrderItemSearchRes"
          description: OK
        "404":
          content:
            application/json:
              examples:
                "0001":
                  summary: 0001 조회 방식이 역할과 맞지 않음
                  value:
                    code: "0001"
                    message: 요청한 리소스를 찾을 수 없습니다.
                "3000":
                  summary: 3000 주문이 없거나 남의 주문
                  value:
                    code: "3000"
                    message: 주문을 찾을 수 없습니다.
                "3001":
                  summary: 3001 `sellerId`가 본인이 아님
                  value:
                    code: "3001"
                    message: 주문을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `0001`: 조회 방식이 역할과 맞지 않음
            - `3000`: 주문이 없거나 남의 주문
            - `3001`: `sellerId`가 본인이 아님
      summary: 주문항목 목록
      tags:
      - OrderItem
  /order-items/{orderItemId}:
    get:
      operationId: orderItem_getOrderItemDetail
      parameters:
      - in: path
        name: orderItemId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItemDetailRes"
          description: OK
        "404":
          content:
            application/json:
              examples:
                "3001":
                  summary: 3001 구매자나 그 상품의 판매자가 아님
                  value:
                    code: "3001"
                    message: 주문을 찾을 수 없습니다.
                "3002":
                  summary: 3002 주문항목이 없음
                  value:
                    code: "3002"
                    message: 주문 항목을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `3002`: 주문항목이 없음
            - `3001`: 구매자나 그 상품의 판매자가 아님
      summary: 주문항목 상세
      tags:
      - OrderItem
  /order-items/{orderItemId}/cancel:
    patch:
      description: 이미 취소된 항목이면 아무것도 바꾸지 않고 200을 준다.
      operationId: orderItem_cancel
      parameters:
      - in: path
        name: orderItemId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "400":
          content:
            application/json:
              examples:
                "3003":
                  summary: 3003 지금 상태에서 할 수 없는 변경
                  value:
                    code: "3003"
                    message: 현재 주문 상태에서는 처리할 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `3003`: 지금 상태에서 할 수 없는 변경"
        "404":
          content:
            application/json:
              examples:
                "3001":
                  summary: 3001 구매자나 그 상품의 판매자가 아님
                  value:
                    code: "3001"
                    message: 주문을 찾을 수 없습니다.
                "3002":
                  summary: 3002 주문항목이 없음
                  value:
                    code: "3002"
                    message: 주문 항목을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `3002`: 주문항목이 없음
            - `3001`: 구매자나 그 상품의 판매자가 아님
        "409":
          content:
            application/json:
              examples:
                "3004":
                  summary: 3004 다른 요청이 먼저 상태를 바꿈. 새로고침한 뒤 다시 시도한다
                  value:
                    code: "3004"
                    message: 주문 상태가 변경되었습니다. 새로고침 후 다시 시도해주세요.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `3004`: 다른 요청이 먼저 상태를 바꿈. 새로고침한 뒤 다시 시도한다"
      security:
      - csrf: []
      summary: 주문항목 취소
      tags:
      - OrderItem
  /order-items/{orderItemId}/confirm:
    patch:
      operationId: orderItem_confirm
      parameters:
      - in: path
        name: orderItemId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "400":
          content:
            application/json:
              examples:
                "3003":
                  summary: 3003 지금 상태에서 할 수 없는 변경
                  value:
                    code: "3003"
                    message: 현재 주문 상태에서는 처리할 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "- `3003`: 지금 상태에서 할 수 없는 변경"
        "404":
          content:
            application/json:
              examples:
                "3001":
                  summary: 3001 주문자가 아님
                  value:
                    code: "3001"
                    message: 주문을 찾을 수 없습니다.
                "3002":
                  summary: 3002 주문항목이 없음
                  value:
                    code: "3002"
                    message: 주문 항목을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `3002`: 주문항목이 없음
            - `3001`: 주문자가 아님
        "409":
          content:
            application/json:
              examples:
