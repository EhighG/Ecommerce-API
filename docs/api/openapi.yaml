            type: array
            items:
              $ref: "#/components/schemas/OrderItemSummary"
          page:
            type: integer
            format: int32
          size:
            type: integer
            format: int32
          totalCount:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
    CartItemListRes:
      type: object
      properties:
        id:
          type: integer
          format: int64
        linePrice:
          type: integer
          format: int64
        product:
          $ref: "#/components/schemas/ProductListRes"
        quantity:
          type: integer
          format: int32
    CategorySummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ChangeQuantityReq:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
      - productId
      - quantity
    CompleteUploadReq:
      type: object
      properties:
        objectKey:
          type: string
          description: 업로드 URL 발급 응답의 `objectKey`
          minLength: 1
      required:
      - objectKey
    CompleteUploadRes:
      type: object
      properties:
        imageId:
          type: integer
          format: int64
        imageUrl:
          type: string
        objectKey:
          type: string
    CouponEventDetailRes:
      type: object
      properties:
        couponEventId:
          type: integer
          format: int64
        discountValue:
          type: integer
          format: int64
        endAt:
          type: string
          format: date-time
        initialQuantity:
          type: integer
          format: int32
        maxDiscountAmount:
          type: integer
          format: int64
        name:
          type: string
        open:
          type: boolean
        remainingQuantity:
          type: integer
          format: int32
          description: "남은 수량. 이벤트가 Redis에 올라가 있지 않으면 `null`이다. 발급 시작 10분 전보다 이를 때\
            , 종료 10분 뒤부터, Redis를 잃고 다시 적재하기 전이 그렇다. 적재는 최대 30초 늦을 수 있다."
        startAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - FIXED_AMOUNT
          - PERCENT
        validSeconds:
          type: integer
          format: int64
    CreateCouponEventReq:
      type: object
      properties:
        discountValue:
          type: integer
          format: int64
          description: "`FIXED_AMOUNT`이면 할인 금액(원), `PERCENT`이면 할인율(%)"
        durationUnit:
          type: string
          enum:
          - MINUTES
          - HOURS
          - DAYS
        endAt:
          type: string
          description: "발급 종료 시각. `yyyy-MM-dd HH:mm:ss`, `timezone` 기준"
          example: 2026-10-08 23:59:59
          minLength: 1
        initialQuantity:
          type: integer
          format: int32
        maxDiscountAmount:
          type: integer
          format: int64
          description: 할인액 상한(원)
        name:
          type: string
          minLength: 1
        startAt:
          type: string
          description: "발급 시작 시각. `yyyy-MM-dd HH:mm:ss`, `timezone` 기준"
          example: 2026-10-01 10:00:00
          minLength: 1
        timezone:
          type: string
          description: IANA 시간대 ID. 비우면 `Asia/Seoul`
          example: Asia/Seoul
        type:
          type: string
          enum:
          - FIXED_AMOUNT
          - PERCENT
        validDurationAmount:
          type: integer
          format: int64
          description: 발급 시점부터 쿠폰을 쓸 수 있는 기간. 단위는 `durationUnit`
      required:
      - durationUnit
      - endAt
      - name
      - startAt
      - type
    CreateUploadUrlReq:
      type: object
      properties:
        contentType:
          type: string
          description: '`image/`로 시작해야 한다. GCS에 올릴 때 같은 값을 `Content-Type` 헤더로 보낸다'
          example: image/png
          minLength: 1
        originalFileName:
          type: string
          description: 확장자만 쓴다
          minLength: 1
      required:
      - contentType
