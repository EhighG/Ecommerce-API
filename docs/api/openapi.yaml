  /orders:
    post:
      description: "장바구니 항목으로 주문한다. 응답은 주문 ID다. 멱등 키를 만들고 재시도하는 방법은 [contracts.md](https://github.com/EhighG/Ecommerce-API/blob/develop/docs/contracts.md)의\
        \ 주문 생성의 멱등 키 절에 있다."
      operationId: order_order
      parameters:
      - description: "규칙은 [contracts.md](https://github.com/EhighG/Ecommerce-API/blob/develop/docs/contracts.md)의\
          \ 주문 생성의 멱등 키 절에 있다."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          example: 3f1e9a2c-7b4d-4c1e-9f0a-2b6c8d1e5a70
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: integer
                format: int64
          description: OK
        "400":
          content:
            application/json:
              examples:
                "2004":
                  summary: 2004 상품 삭제와 주문이 동시에 일어남
                  value:
                    code: "2004"
                    message: 삭제된 상품입니다.
                "2501":
                  summary: 2501 재고가 모자람
                  value:
                    code: "2501"
                    message: 주문 가능한 재고가 부족합니다.
                "7501":
                  summary: "7501 쓸 수 없는 쿠폰(이미 사용, 만료)"
                  value:
                    code: "7501"
                    message: 사용할 수 없는 쿠폰입니다.
                "7509":
                  summary: 7509 같은 쿠폰을 두 번 씀
                  value:
                    code: "7509"
                    message: 같은 쿠폰은 중복 사용할 수 없습니다.
                "9001":
                  summary: 9001 한 주문에 같은 장바구니 항목이 두 번 있음
                  value:
                    code: "9001"
                    message: 요청 값이 올바르지 않습니다.
                "9100":
                  summary: 9100 `Idempotency-Key` 헤더가 없음
                  value:
                    code: "9100"
                    message: Idempotency-Key 헤더가 없습니다.
                "9101":
                  summary: 9101 `Idempotency-Key` 형식이 틀림
                  value:
                    code: "9101"
                    message: Idempotency-Key 형식이 올바르지 않습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `9100`: `Idempotency-Key` 헤더가 없음
            - `9101`: `Idempotency-Key` 형식이 틀림
            - `9001`: 한 주문에 같은 장바구니 항목이 두 번 있음
            - `9001`: 할인액이 0원이 되는 쿠폰을 씀. 메시지는 경우마다 다르다
            - `2004`: 상품 삭제와 주문이 동시에 일어남
            - `7509`: 같은 쿠폰을 두 번 씀
            - `7501`: 쓸 수 없는 쿠폰(이미 사용, 만료)
            - `2501`: 재고가 모자람
        "404":
          content:
            application/json:
              examples:
                "7000":
                  summary: 7000 장바구니 항목이 없거나 남의 항목. 상품을 삭제하면 장바구니 항목도 지워지므로 삭제된 상품도
                    대개 이 코드다
                  value:
                    code: "7000"
                    message: 장바구니 항목을 찾을 수 없습니다.
                "7510":
                  summary: 7510 쿠폰이 없거나 남의 쿠폰
                  value:
                    code: "7510"
                    message: 해당 쿠폰을 찾을 수 없습니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `7000`: 장바구니 항목이 없거나 남의 항목. 상품을 삭제하면 장바구니 항목도 지워지므로 삭제된 상품도 대개 이 코드다
            - `7510`: 쿠폰이 없거나 남의 쿠폰
        "409":
          content:
            application/json:
              examples:
                "9102":
                  summary: 9102 같은 키로 다른 내용을 보냄. 같은 키로 다시 보내지 않는다
                  value:
                    code: "9102"
                    message: 같은 Idempotency-Key로 다른 요청을 보낼 수 없습니다.
                "9103":
                  summary: 9103 같은 키의 요청이 처리 중이거나 막 처리됨. 잠시 후 같은 키로 다시 보낸다
                  value:
                    code: "9103"
                    message: 동일한 요청이 이미 처리 중입니다.
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |-
            - `9102`: 같은 키로 다른 내용을 보냄. 같은 키로 다시 보내지 않는다
            - `9103`: 같은 키의 요청이 처리 중이거나 막 처리됨. 잠시 후 같은 키로 다시 보낸다
